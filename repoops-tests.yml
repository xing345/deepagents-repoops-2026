name: RepoOps tests

on:
  push:
    paths:
      - "apps/repoops/**"
      - "libs/deepagents/**"
      - ".github/workflows/repoops-tests.yml"
  pull_request:
    paths:
      - "apps/repoops/**"
      - "libs/deepagents/**"
      - ".github/workflows/repoops-tests.yml"

jobs:
  offline-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/repoops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ty check src --extra-search-path ../../libs/deepagents
