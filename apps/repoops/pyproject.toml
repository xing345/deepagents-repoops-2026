[project]
name = "repoops-agent"
version = "0.1.0"
description = "工程化代码仓库 Agent：检索、任务恢复、安全执行与离线评测"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "deepagents",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repoops"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
    "ty>=0.0.1",
]

[tool.uv.sources]
deepagents = { path = "../../libs/deepagents", editable = true }

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
filterwarnings = [
    "error",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ty.environment]
python-version = "3.11"
root = ["src"]
